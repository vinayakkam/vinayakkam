        <rect x="-5" y="120" width="50" height="16" fill="#922b21" rx="3"/>
      </g>
    
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="840 0; 0 0"
          dur="4s" begin="0s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="40" height="90" fill="#E03C3C" rx="3"/>
        <rect x="-5" y="74" width="50" height="16" fill="#922b21" rx="3"/>
        <rect x="0" y="160" width="40" height="10" fill="#E03C3C" rx="3"/>
        <rect x="-5" y="160" width="50" height="16" fill="#922b21" rx="3"/>
      </g>
    
  </g>

  <!-- Bird -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="150 85.0; 150 89.2; 150 93.3; 150 97.4; 150 101.3; 150 105.0; 150 108.5; 150 111.8; 150 114.7; 150 117.4; 150 119.6; 150 121.5; 150 123.0; 150 124.1; 150 124.8; 150 125.0; 150 124.8; 150 124.1; 150 123.0; 150 121.5; 150 119.6; 150 117.4; 150 114.7; 150 111.8; 150 108.5; 150 105.0; 150 101.3; 150 97.4; 150 93.3; 150 89.2; 150 85.0; 150 80.8; 150 76.7; 150 72.6; 150 68.7; 150 65.0; 150 61.5; 150 58.2; 150 55.3; 150 52.6; 150 50.4; 150 48.5; 150 47.0; 150 45.9; 150 45.2; 150 45.0; 150 45.2; 150 45.9; 150 47.0; 150 48.5; 150 50.4; 150 52.6; 150 55.3; 150 58.2; 150 61.5; 150 65.0; 150 68.7; 150 72.6; 150 76.7; 150 80.8; 150 85.0"
