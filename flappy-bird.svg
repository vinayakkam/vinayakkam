" opacity="0.7"/><circle cx="590" cy="150" r="1" fill="white" opacity="0.5"/><circle cx="45" cy="34" r="1" fill="white" opacity="0.5"/><circle cx="93" cy="124" r="1" fill="white" opacity="0.6"/><circle cx="498" cy="29" r="1" fill="white" opacity="0.8"/><circle cx="286" cy="45" r="1" fill="white" opacity="0.5"/><circle cx="502" cy="96" r="1" fill="white" opacity="0.5"/>

