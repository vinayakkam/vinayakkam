          values="300 0; -540 0"
          dur="4s" begin="0s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="40" height="60" fill="#E03C3C" rx="3"/>
        <rect x="-5" y="44" width="50" height="16" fill="#922b21" rx="3"/>
        <rect x="0" y="130" width="40" height="40" fill="#E03C3C" rx="3"/>
        <rect x="-5" y="130" width="50" height="16" fill="#922b21" rx="3"/>
      </g>
    
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="480 0; -360 0"
          dur="4s" begin="0s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="40" height="100" fill="#E03C3C" rx="3"/>
        <rect x="-5" y="84" width="50" height="16" fill="#922b21" rx="3"/>
        <rect x="0" y="170" width="40" height="0" fill="#E03C3C" rx="3"/>
        <rect x="-5" y="170" width="50" height="16" fill="#922b21" rx="3"/>
      </g>
    
      <g>
