name: Generate Flappy Bird

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate Flappy Bird SVG
        run: |
          python3 << 'PYEOF'
          import os, math, random

          W, H = 800, 200
          BIRD_X = 150
          PIPE_W = 40
          GAP = 70
          NUM_PIPES = 4
          PIPE_SPACING = 180
          DURATION = 4  # seconds per loop

          # Pipe positions and gap heights (randomish but fixed for clean loop)
          pipes = [
              {"x": 300, "gap_y": 60},
              {"x": 480, "gap_y": 100},
              {"x": 660, "gap_y": 50},
              {"x": 840, "gap_y": 90},
          ]

          # Bird bounces up/down sinusoidally
          # At t=0 bird is at center
          BG_SKY = "#0d1117"
          BG_GROUND = "#161b22"
          PIPE_COLOR = "#E03C3C"
          PIPE_DARK = "#922b21"
          BIRD_COLOR = "#FFD700"
          BIRD_DARK = "#FFA500"
          GROUND_LINE = "#30363d"

          # Build pipe SVG elements with animation
          pipe_svgs = []
          for i, p in enumerate(pipes):
              ox = p["x"]
              gy = p["gap_y"]
              top_h = gy
              bot_y = gy + GAP
              bot_h = H - 30 - bot_y

              delay = 0  # all pipes move together

              # Top pipe
              pipe_svgs.append(f'''
                <g>
                  <animateTransform attributeName="transform" type="translate"
                    values="{ox} 0; {ox - W - PIPE_W} 0"
                    dur="{DURATION}s" begin="{0}s" repeatCount="indefinite"/>
                  <rect x="0" y="0" width="{PIPE_W}" height="{top_h}" fill="{PIPE_COLOR}" rx="3"/>
                  <rect x="-5" y="{top_h - 16}" width="{PIPE_W+10}" height="16" fill="{PIPE_DARK}" rx="3"/>
                  <rect x="0" y="{bot_y}" width="{PIPE_W}" height="{bot_h}" fill="{PIPE_COLOR}" rx="3"/>
                  <rect x="-5" y="{bot_y}" width="{PIPE_W+10}" height="16" fill="{PIPE_DARK}" rx="3"/>
                </g>
              ''')

          # Bird wing flap frames
          wing_up = f'''
            <ellipse cx="0" cy="-3" rx="7" ry="4" fill="{BIRD_DARK}" transform="rotate(-20)"/>
          '''
          wing_down = f'''
            <ellipse cx="0" cy="3" rx="7" ry="4" fill="{BIRD_DARK}" transform="rotate(20)"/>
          '''

          bird_y_values = []
          steps = 60
          for i in range(steps + 1):
              t = i / steps
              y = 85 + 40 * math.sin(2 * math.pi * t)
              bird_y_values.append(f"{BIRD_X} {y:.1f}")
          bird_path = "; ".join(bird_y_values)

          # Rotation animation (tilt up when rising, down when falling)
          rot_values = []
          for i in range(steps + 1):
              t = i / steps
              rot = -20 * math.cos(2 * math.pi * t)
              rot_values.append(f"{rot:.1f}")
          rot_path = "; ".join(rot_values)

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">
            <defs>
              <clipPath id="clip">
                <rect width="{W}" height="{H}"/>
              </clipPath>
            </defs>

            <!-- Sky -->
            <rect width="{W}" height="{H}" fill="{BG_SKY}"/>

            <!-- Stars -->
            {''.join([f'<circle cx="{random.randint(0,W)}" cy="{random.randint(0,H-30)}" r="1" fill="white" opacity="{random.uniform(0.3,0.8):.1f}"/>' for _ in range(40)])}

            <!-- Ground -->
            <rect y="{H-30}" width="{W}" height="30" fill="{BG_GROUND}"/>
            <line x1="0" y1="{H-30}" x2="{W}" y2="{H-30}" stroke="{GROUND_LINE}" stroke-width="2"/>

            <!-- Pipes -->
            <g clip-path="url(#clip)">
              {''.join(pipe_svgs)}
            </g>

            <!-- Bird -->
            <g>
              <animateTransform attributeName="transform" type="translate"
                values="{bird_path}"
                dur="{DURATION}s" repeatCount="indefinite"/>
              <g>
                <animateTransform attributeName="transform" type="rotate"
                  values="{rot_path}"
                  dur="{DURATION}s" repeatCount="indefinite"/>
                <!-- Body -->
                <ellipse rx="14" ry="11" fill="{BIRD_COLOR}"/>
                <!-- Wing -->
                <ellipse cx="-2" cy="2" rx="7" ry="4" fill="{BIRD_DARK}">
                  <animateTransform attributeName="transform" type="rotate"
                    values="0;-30;0;20;0" dur="0.3s" repeatCount="indefinite"/>
                </ellipse>
                <!-- Eye -->
                <circle cx="6" cy="-3" r="4" fill="white"/>
                <circle cx="7" cy="-3" r="2" fill="#1a1a2e"/>
                <circle cx="8" cy="-4" r="0.7" fill="white"/>
                <!-- Beak -->
                <polygon points="13,-2 20,0 13,3" fill="#FF8C00"/>
              </g>
            </g>

            <!-- Score text -->
            <text x="20" y="30" font-family="monospace" font-size="14" fill="#E03C3C" font-weight="bold">OLIT BOT</text>
            <text x="20" y="50" font-family="monospace" font-size="11" fill="#888">flappy edition</text>
          </svg>'''

          os.makedirs("dist", exist_ok=True)
          with open("dist/flappy-bird.svg", "w") as f:
              f.write(svg)
          print("Flappy Bird SVG generated!")
          PYEOF

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
