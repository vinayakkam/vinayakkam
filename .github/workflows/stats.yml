name: Generate Stats Dashboard

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Custom dashboard card (rank, stats, languages, 52-week skyline). A failed run pushes nothing,
      # so the last good card stays on the output branch.
      - name: Generate dashboard
        run: python .github/scripts/dashboard.py
        env:
          # Add a GH_STATS_PAT secret (read:user, repo) to include private contributions.
          GITHUB_TOKEN: ${{ secrets.GH_STATS_PAT || secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          keep_files: true
