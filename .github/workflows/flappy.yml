name: Generate Flappy Bird

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate Flappy Bird SVG
        run: |
          cat > gen.py << 'PYEOF'
          import os, math, random
          random.seed(77)
          W, H = 900, 220
          GROUND_H = 30
          SKY_H = H - GROUND_H
          PIPE_COLOR = "#E03C3C"
          PIPE_DARK = "#7B1212"
          PIPE_HIGHLIGHT = "#FF6B6B"
          BIRD_COLOR = "#FFD700"
          BIRD_DARK = "#FFA500"
          BG_SKY = "#0d1117"
          BG_GROUND = "#161b22"
          GROUND_LINE = "#30363d"
          GAP = 75
          PIPE_W = 42
          CAP_H = 15
          CAP_EXTRA = 10
          DUR = 7.0
          NUM_PIPES = 6
          BIRD_X = 155
          pipe_speed = (W + PIPE_W + 20) / DUR
          gap_centers = [80, 125, 65, 130, 75, 115]
          cross_times = []
          for i in range(NUM_PIPES):
              t_cross = (i * DUR / NUM_PIPES + (W - BIRD_X) / pipe_speed) % DUR
              cross_times.append(t_cross)
          pipe_order = sorted(range(NUM_PIPES), key=lambda i: cross_times[i])
          sorted_kf = [(cross_times[i], gap_centers[i]) for i in pipe_order]
          t_last, y_last = sorted_kf[-1]
          t_first, y_first = sorted_kf[0]
          wrap_gap = (t_first + DUR - t_last)
          if wrap_gap > 0:
              frac = (DUR - t_last) / wrap_gap
              frac_cos = (1 - math.cos(frac * math.pi)) / 2
              y_at_zero = y_last + (y_first - y_last) * frac_cos
          else:
              y_at_zero = y_first
          full_kf = [(0.0, y_at_zero)] + sorted_kf + [(DUR, y_at_zero)]
          STEPS = 180
          translate_vals = []
          rotate_vals = []
          key_times_list = []
          def cosine_interp(t, kf_list):
              for i in range(len(kf_list) - 1):
                  t0, y0 = kf_list[i]
                  t1, y1 = kf_list[i + 1]
                  if t0 <= t <= t1:
                      if t1 == t0:
                          return y0
                      frac = (t - t0) / (t1 - t0)
                      frac_cos = (1 - math.cos(frac * math.pi)) / 2
                      return y0 + (y1 - y0) * frac_cos
              return kf_list[-1][1]
          for i in range(STEPS + 1):
              t = i / STEPS * DUR
              y = cosine_interp(t, full_kf)
              translate_vals.append(f"{BIRD_X} {y:.2f}")
              key_times_list.append(f"{i/STEPS:.5f}")
              eps = DUR / STEPS * 0.5
              y_fwd = cosine_interp(min(t + eps, DUR), full_kf)
              y_bwd = cosine_interp(max(t - eps, 0), full_kf)
              dy = (y_fwd - y_bwd) / (2 * eps)
              rot = max(-38, min(38, dy * 0.55))
              rotate_vals.append(f"{rot:.2f}")
          stars = "".join([f'<circle cx="{random.randint(5,W-5)}" cy="{random.randint(5,SKY_H-5)}" r="{random.uniform(0.5,1.4):.1f}" fill="white" opacity="{random.uniform(0.15,0.75):.1f}"/>' for _ in range(60)])
          gd  = "".join([f'<rect x="{i*50}" y="{H-GROUND_H+9}" width="32" height="3" fill="#21262d" rx="1"/>' for i in range(22)])
          gd2 = "".join([f'<rect x="{W+i*50}" y="{H-GROUND_H+9}" width="32" height="3" fill="#21262d" rx="1"/>' for i in range(22)])
          pipe_svgs = []
          for i in range(NUM_PIPES):
              gc = gap_centers[i]
              top_h = gc - GAP // 2
              bot_y = gc + GAP // 2
              bot_h = SKY_H - bot_y
              end_x = -(PIPE_W + CAP_EXTRA + 20)
              delay = -(i / NUM_PIPES * DUR)
              pipe_svgs.append(f'<g><animateTransform attributeName="transform" type="translate" from="{W} 0" to="{end_x} 0" dur="{DUR}s" begin="{delay:.4f}s" repeatCount="indefinite"/><rect x="0" y="0" width="{PIPE_W}" height="{max(top_h-CAP_H,0)}" fill="{PIPE_COLOR}" rx="2"/><rect x="3" y="2" width="5" height="{max(top_h-CAP_H-4,0)}" fill="{PIPE_HIGHLIGHT}" opacity="0.3" rx="1"/><rect x="-{CAP_EXTRA//2}" y="{max(top_h-CAP_H,0)}" width="{PIPE_W+CAP_EXTRA}" height="{CAP_H}" fill="{PIPE_DARK}" rx="4"/><rect x="-{CAP_EXTRA//2}" y="{bot_y}" width="{PIPE_W+CAP_EXTRA}" height="{CAP_H}" fill="{PIPE_DARK}" rx="4"/><rect x="0" y="{bot_y+CAP_H}" width="{PIPE_W}" height="{max(bot_h-CAP_H,0)}" fill="{PIPE_COLOR}" rx="2"/><rect x="3" y="{bot_y+CAP_H+2}" width="5" height="{max(bot_h-CAP_H-4,0)}" fill="{PIPE_HIGHLIGHT}" opacity="0.3" rx="1"/></g>')
          tv = "; ".join(translate_vals)
          rv = "; ".join(rotate_vals)
          kt = "; ".join(key_times_list)
          svg = f"""<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}"><defs><clipPath id="scene"><rect width="{W}" height="{H}"/></clipPath><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFD700" stop-opacity="0.45"/><stop offset="100%" stop-color="#FFD700" stop-opacity="0"/></radialGradient></defs><rect width="{W}" height="{H}" fill="{BG_SKY}"/>{stars}<rect y="{H-GROUND_H}" width="{W}" height="{GROUND_H}" fill="{BG_GROUND}"/><line x1="0" y1="{H-GROUND_H}" x2="{W}" y2="{H-GROUND_H}" stroke="{GROUND_LINE}" stroke-width="2"/><g clip-path="url(#scene)"><g><animateTransform attributeName="transform" type="translate" from="0 0" to="-{W} 0" dur="{DUR*0.45:.2f}s" repeatCount="indefinite"/>{gd}{gd2}</g></g><g clip-path="url(#scene)">{"".join(pipe_svgs)}</g><g><animateTransform attributeName="transform" type="translate" values="{tv}" keyTimes="{kt}" calcMode="linear" dur="{DUR}s" repeatCount="indefinite"/><ellipse rx="26" ry="20" fill="url(#glow)"/></g><g><animateTransform attributeName="transform" type="translate" values="{tv}" keyTimes="{kt}" calcMode="linear" dur="{DUR}s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="{rv}" keyTimes="{kt}" calcMode="linear" dur="{DUR}s" repeatCount="indefinite"/><ellipse cx="2" cy="14" rx="12" ry="4" fill="black" opacity="0.2"/><ellipse rx="16" ry="13" fill="{BIRD_COLOR}"/><ellipse cx="-3" cy="-4" rx="7" ry="5" fill="white" opacity="0.14"/><ellipse cx="-4" cy="1" rx="9" ry="5" fill="{BIRD_DARK}"><animateTransform attributeName="transform" type="rotate" values="0;-42;0;32;0" dur="0.21s" repeatCount="indefinite"/></ellipse><circle cx="6" cy="-4" r="5" fill="white"/><circle cx="7.5" cy="-4" r="2.8" fill="#111"/><circle cx="9" cy="-5.5" r="1.1" fill="white"/><polygon points="14,-4 23,-1 14,1" fill="#FF8C00"/><polygon points="14,1 22,2 14,4" fill="#FF6600"/></g></g><rect x="10" y="10" width="92" height="42" fill="black" opacity="0.4" rx="6"/><text x="20" y="28" font-family="monospace" font-size="13" fill="{PIPE_COLOR}" font-weight="bold">OLIT BOT</text><text x="20" y="44" font-family="monospace" font-size="9" fill="#666">flappy edition</text></svg>"""
          os.makedirs("dist", exist_ok=True)
          with open("dist/flappy-bird.svg", "w") as f:
              f.write(svg)
          print("Done!")
          PYEOF
          python3 gen.py

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          keep_files: true
